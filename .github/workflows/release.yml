name: Release

# Push a tag such as v1.0.0 to build GameMod.exe and publish GameMod.zip as a GitHub release.
# Running it by hand from the Actions tab builds the zip without publishing it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m pytest -q
      - run: python tools/build_exe.py
      - run: python tools/make_release.py
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash release/GameMod.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  GameMod.zip" | Out-File release/SHA256SUMS.txt -Encoding ascii
      - name: Keep the build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: GameMod
          path: |
            release/GameMod.zip
            release/SHA256SUMS.txt
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          python tools/release_notes.py $tag release/notes.md "${{ github.repository }}"
          gh release create $tag release/GameMod.zip release/SHA256SUMS.txt --title "GameMod $tag" --notes-file release/notes.md
